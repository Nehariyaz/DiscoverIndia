name: CD for DiscoverIndia

on:
  workflow_run:
    workflows: ["CI for DiscoverIndia"]
    types: [completed]
    branches: [main]
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  id-token: write   # needed for OIDC login to AWS
  contents: read

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: discoverindia
  LAMBDA_FUNCTION: discoverbackend
  AWS_ROLE_ARN: arn:aws:iam::156234218863:role/github-actions-discoverindia

jobs:
  deploy-frontend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build Angular app
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync frontend/dist/project/browser s3://${{ env.S3_BUCKET }} --delete

  deploy-backend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Package Lambda function
        working-directory: backend
        run: zip -r ../function.zip . -x "tests/*" ".env*" "*.md"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --zip-file fileb://function.zip
          aws lambda wait function-updated --function-name ${{ env.LAMBDA_FUNCTION }}