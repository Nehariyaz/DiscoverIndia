name: CI for DiscoverIndia

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    env:
      DB_URI: ${{ secrets.TEST_DB_URI }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      RECAPTCHA_SECRET_KEY: ${{ secrets.TEST_RECAPTCHA_SECRET_KEY }}
      GMAIL_USER: ${{ secrets.TEST_GMAIL_USER }}
      GMAIL_PASS: ${{ secrets.TEST_GMAIL_PASS }}
      FRONTEND_URL: ${{ secrets.TEST_FRONTEND_URL }}
      NODE_ENV: ${{ secrets.TEST_NODE_ENV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: npm install

      - name: Fix permissions for cross-env and mocha
        run: |
          chmod +x ./node_modules/.bin/cross-env
          chmod +x ./node_modules/.bin/mocha

      - name: Wait for MongoDB to be ready
        run: |
          echo "Waiting for MongoDB to be ready..."
          until nc -z localhost 27017; do sleep 1; done

      - name: Run Mocha tests
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ensure package.json exists
        run: |
          if [ ! -f package.json ]; then
            echo "❌ package.json not found!"
            exit 1
          fi

      - name: Install frontend dependencies (with legacy-peer-deps)
        run: npm install --legacy-peer-deps

      - name: Build Angular app without strict budgets
        run: npm run build -- --configuration=development --no-progress

    ml-service-check:
    name: ML Service Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ml_service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run syntax check on ML service
        run: python -m compileall .
