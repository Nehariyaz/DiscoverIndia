name: CI for DiscoverIndia

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    env:
      DB_URI: ${{ secrets.TEST_DB_URI }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      RECAPTCHA_SECRET_KEY: ${{ secrets.TEST_RECAPTCHA_SECRET_KEY }}
      GMAIL_USER: ${{ secrets.TEST_GMAIL_USER }}
      GMAIL_PASS: ${{ secrets.TEST_GMAIL_PASS }}
      FRONTEND_URL: ${{ secrets.TEST_FRONTEND_URL }}
      NODE_ENV: ${{ secrets.TEST_NODE_ENV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: npm install

      - name: Fix permissions for cross-env and mocha
        run: |
          chmod +x ./node_modules/.bin/cross-env
          chmod +x ./node_modules/.bin/mocha

      - name: Wait for MongoDB to be ready
        run: |
          echo "Waiting for MongoDB to be ready..."
          until nc -z localhost 27017; do sleep 1; done

      - name: Run Mocha tests
        run: npm test

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Chrome
        run: |
          sudo apt update
          sudo apt install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt update
          sudo apt install -y google-chrome-stable

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests with ChromeHeadless
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular app without strict budgets
        run: npm run build -- --configuration=development --no-progress

  selenium-e2e-tests:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest

    # Using repo root so relative paths work
    defaults:
      run:
        working-directory: .

    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      # Wait for MongoDB service before starting backend server
      - name: Wait for MongoDB to be ready
        run: |
          echo "Waiting for MongoDB to be ready..."
          until nc -z localhost 27017; do sleep 1; done

      # Start backend server with PORT=5000 environment variable
      - name: Start backend server
        run: |
          cd backend
          npm install
          export PORT=5000
          node index.js &
          cd -

      # Start frontend server with host accessible externally
      - name: Start frontend server
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm start -- --host=0.0.0.0 --disable-host-check &

      # Wait for frontend to be ready before starting tests
      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:4200

      # Wait for backend to be ready before starting tests
      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:5000 --timeout 180000 # 3 mins timeout

      # Debug: List running node processes  
      - name: List running node processes
        run: ps aux | grep node

      # Debug: Check ports listening on 5000
      - name: Check open ports
        run: sudo netstat -tuln | grep 5000 || echo "Port 5000 not open"

      # Wait for Selenium Chrome server availability
      - name: Wait for Selenium server
        run: |
          echo "Waiting for Selenium server at localhost:4444..."
          until nc -z localhost 4444; do sleep 1; done

      # Run Selenium tests via Maven
      - name: Run Selenium E2E Tests
        run: mvn test

  ml-service-check:
    name: ML Service Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ml_service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run syntax check on ML service
        run: python -m compileall .
