<div class="account-wrapper">
  <div class="account-left"></div>

  <div class="account-right">
    <div class="form-container">
      <h1>Personalize Your Experience With Us</h1>
      <p class="subtitle">Create an account or login to access personalized features</p>

      <div class="toggle-tabs">
        <span (click)="mode = 'signup'" [class.active]="mode === 'signup'">Sign Up</span>
        <span class="divider">|</span>
        <span (click)="mode = 'login'" [class.active]="mode === 'login'">Login</span>
      </div>

      <div class="forms-wrapper">
        <!-- Signup Form -->
        <form
          *ngIf="mode === 'signup'"
          (ngSubmit)="onSignupSubmit()"
          #signupForm="ngForm"
          class="auth-form active"
        >
          <div class="form-group">
            <div class="row">
              <input
                type="text"
                placeholder="First Name*"
                name="firstName"
                [(ngModel)]="form.firstName"
                required
                #firstName="ngModel"
              />
              <input
                type="text"
                placeholder="Last Name*"
                name="lastName"
                [(ngModel)]="form.lastName"
                required
                #lastName="ngModel"
              />
            </div>

            <div class="row">
              <input
                type="email"
                placeholder="Email*"
                name="email"
                [(ngModel)]="form.email"
                required
                email
                #email="ngModel"
              />
            </div>

            <div class="row">
              <input
                type="password"
                placeholder="Password*"
                name="password"
                [(ngModel)]="form.password"
                required
                minlength="6"
                #password="ngModel"
              />
              <input
                type="password"
                placeholder="Confirm Password*"
                name="confirmPassword"
                [(ngModel)]="form.confirmPassword"
                required
                #confirmPassword="ngModel"
              />
            </div>

            <!-- COUNTRY SELECT REMOVED -->
          </div>

          <div class="recaptcha-box">
            <re-captcha
              [siteKey]="siteKey"
              (resolved)="onCaptchaResolved($event, 'signup')"
            ></re-captcha>
          </div>

          <button type="submit" class="btn-primary">Create Account</button>
          <div *ngIf="signupError" class="error-text">{{ signupError }}</div>
          <div *ngIf="signupSuccess" class="success-text">{{ signupSuccess }}</div>
        </form>

        <!-- Login Form -->
        <form
          *ngIf="mode === 'login'"
          (ngSubmit)="onLoginSubmit()"
          #loginForm="ngForm"
          class="auth-form active"
        >
          <div class="form-group">
            <div class="row">
              <input
                type="email"
                placeholder="Email*"
                name="loginEmail"
                [(ngModel)]="loginEmail"
                required
                email
                #loginEmailCtrl="ngModel"
              />
            </div>
            <div class="row">
              <input
                type="password"
                placeholder="Password*"
                name="loginPassword"
                [(ngModel)]="loginPassword"
                required
                #loginPasswordCtrl="ngModel"
              />
            </div>
          </div>

          <div class="forgot-password">
            <a routerLink="/forgot-password" routerLinkActive="active">
              Forgot password?
            </a>
          </div>

          <div class="recaptcha-box">
            <re-captcha
              [siteKey]="siteKey"
              (resolved)="onCaptchaResolved($event, 'login')"
            ></re-captcha>
          </div>

          <button type="submit" class="btn-primary">Log In</button>
          <div *ngIf="loginError" class="error-text">{{ loginError }}</div>
          <div *ngIf="loginSuccess" class="success-text">{{ loginSuccess }}</div>
        </form>
      </div>
    </div>
  </div>
</div>
