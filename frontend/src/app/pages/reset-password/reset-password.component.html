<div class="account-wrapper">
  <div class="account-left"></div>

  <div class="account-right">
    <div class="form-container">
      <h1>Set New Password</h1>

      <form (ngSubmit)="onSubmit()" class="auth-form active" #resetForm="ngForm" novalidate>
        <div class="form-group">
          <div class="row">
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="New Password*"
              required
              minlength="6"
              #passwordInput="ngModel"
            />
          </div>
          <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="error-message">
            <small *ngIf="passwordInput.errors?.['required']">Password is required.</small>
            <small *ngIf="passwordInput.errors?.['minlength']">Password must be at least 6 characters.</small>
          </div>
        </div>

        <div class="form-group">
          <div class="row">
            <input
              type="password"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm Password*"
              required
              #confirmPasswordInput="ngModel"
            />
          </div>
          <div *ngIf="confirmPasswordInput.invalid && (confirmPasswordInput.dirty || confirmPasswordInput.touched)" class="error-message">
            <small *ngIf="confirmPasswordInput.errors?.['required']">Please confirm your password.</small>
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="success-message">
          {{ successMessage }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading || resetForm.invalid">
          {{ isLoading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>

    </div>
  </div>
</div>
